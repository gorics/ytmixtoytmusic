name: Fetch Lab

on:
  push:
    branches: [fetch-lab]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch target
        continue-on-error: true
        run: |
          rm -rf out
          python tools/fetch_probe.py | tee fetch-run.log
          cp fetch-run.log out/fetch-run.log 2>/dev/null || true

      - name: Probe media header variants
        continue-on-error: true
        run: |
          python tools/media_header_probe.py | tee media-probe.log
          cp media-probe.log out/media-probe.log 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-lab-results
          path: out/
          retention-days: 1
